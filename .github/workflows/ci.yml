name: Spring Boot CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Run Tests with JaCoCo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ms-vehiculos

    steps:
      # Paso 1: Checkout del repositorio
      - name: Checkout code
        uses: actions/checkout@v4

      # Paso 2: Configurar JDK 21 (con cache de dependencias Maven)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven
          cache-dependency-path: ms-vehiculos/pom.xml

      # Paso 3: Construir el proyecto y ejecutar tests (JaCoCo genera el reporte)
      - name: Build and test
        run: mvn clean verify

      # Paso 4: Publicar reporte de cobertura de JaCoCo
      - name: Upload JaCoCo Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: ms-vehiculos/target/site/jacoco/

  build:
    name: Build Jar
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: ms-vehiculos

    steps:
      # Paso 1: Checkout del repositorio
      - name: Checkout code
        uses: actions/checkout@v4

      # Paso 2: Configurar JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven
          cache-dependency-path: ms-vehiculos/pom.xml

      # Paso 3: Construir el artefacto JAR
      - name: Package application
        run: mvn clean package -DskipTests

      # Paso 4: Subir artefacto JAR
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: ms-vehiculos/target/*.jar