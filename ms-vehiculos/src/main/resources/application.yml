spring:
  application:
    name: ms-vehiculos
  datasource:
    url: ${DB_URL:jdbc:mysql://${IP_SSH}:3306/vehiculos?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: ${SERVER_PORT:9004}
